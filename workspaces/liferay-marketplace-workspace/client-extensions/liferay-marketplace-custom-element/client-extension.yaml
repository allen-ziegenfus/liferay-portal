assemble:
    - from: build
      include: "static/**/*"
      into: static
liferay-marketplace-custom-element:
    cssURLs:
        - .*.css
    friendlyURLMapping: liferay-marketplace-custom-element
    htmlElementName: liferay-marketplace-custom-element
    instanceable: false
    name: Publisher Dashboard
    portletCategoryName: category.client-extensions
    type: customElement
    urls:
        - .*.js
    useESM: false
liferay-marketplace-create-new-app-custom-element:
    cssURLs:
        - .*.css
    friendlyURLMapping: liferay-marketplace-custom-element
    htmlElementName: liferay-marketplace-custom-element
    instanceable: false
    name: Create New App
    portletCategoryName: category.client-extensions
    properties:
      route: create-new-app
    type: customElement
    urls:
        - .*.js
    useESM: false