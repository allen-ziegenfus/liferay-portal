plugins {
	id "java"
	id "org.springframework.boot" version "3.4.5"
	id "io.spring.dependency-management" version "1.1.7"
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
	implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
	implementation "org.springframework.boot:spring-boot-starter-web"

	// Two artifacts, and only the second one has any Spring in it. On the next
	// framework generation the core coordinate does not change at all.
	implementation "com.liferay:com.liferay.client.extension.core:1.0.0"
	implementation "com.liferay:com.liferay.client.extension.spring.boot.adapter:1.0.0"
}
