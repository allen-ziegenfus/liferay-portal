# Liferay Cloud injects these. Listed for local development only.
com.liferay.lxc.dxp.domains=acme.lxc.liferay.com
com.liferay.lxc.dxp.mainDomain=acme.lxc.liferay.com
com.liferay.lxc.dxp.server.protocol=https

liferay.oauth.application.external.reference.codes=acme-inventory-headless-server

# The core reads these names. Nothing about them is Spring-specific, which is
# why the same core serves a Quarkus or Micronaut adapter unchanged.
#acme-inventory-headless-server.oauth2.headless.server.client.id=...
#acme-inventory-headless-server.oauth2.headless.server.client.secret=...

# Switch the whole adapter off without removing the dependency.
#liferay.client.extension.enabled=false
