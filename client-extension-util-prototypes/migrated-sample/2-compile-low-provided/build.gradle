// THE ONLY FILE THAT CHANGES.
//
// ObjectAction2RestController.java and SampleSpringBootApplication.java in this
// directory are byte-identical to 0-today/. Verify with:
//
//   diff -r 0-today/src 2-compile-low-provided/src
//
// What changes below, and why it matters even though no Java moved:
//
// BEFORE (0-today/build.gradle):
//
//   classpath group: "org.springframework.boot",
//       name: "spring-boot-gradle-plugin", version: "2.7.18"
//   ...
//   implementation group: "com.liferay",
//       name: "com.liferay.client.extension.util.spring.boot3",
//       version: "latest.release"
//   implementation group: "org.springframework.boot",
//       name: "spring-boot-starter-web", version: "2.7.18"
//   implementation group: "org.springframework.boot",
//       name: "spring-boot-starter-webflux", version: "2.7.18"
//
// That is Spring Boot 2.7.18 declared three times, next to a library that
// declares Spring Boot 3.5.14 as "api". Both majors land on one classpath and
// Gradle picks a winner. This is the canonical sample that customers copy.
//
// Once the library stops re-exporting Spring, the conflict cannot happen: there
// is only one place a Spring version is declared, and it is here.

plugins {
	id "java"
	id "org.springframework.boot" version "3.4.5"
	id "io.spring.dependency-management" version "1.1.7"
}

dependencies {
	// Same artifact, same package, same classes. It simply no longer brings
	// Spring with it.
	implementation "com.liferay:com.liferay.client.extension.util.spring.boot3:1.1.0"

	implementation "com.liferay:org.apache.commons.logging:1.2.LIFERAY-PATCHED-2"
	implementation "org.json:json:20231013"

	// Now declared once, by us, with no version. Spring's BOM decides.
	implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
	implementation "org.springframework.boot:spring-boot-starter-web"

	// Still required, because BaseService is still reactive underneath. Option
	// 2 does not change that; Options 1, 3 and 4 do.
	implementation "org.springframework.boot:spring-boot-starter-webflux"
}
