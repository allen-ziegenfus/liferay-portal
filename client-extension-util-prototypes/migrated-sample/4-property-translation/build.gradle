plugins {
	id "java"
	id "org.springframework.boot" version "3.4.5"
	id "io.spring.dependency-management" version "1.1.7"
}

dependencies {
	implementation "org.json:json:20231013"

	implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
	implementation "org.springframework.boot:spring-boot-starter-web"

	// runtimeOnly, accurately: no source file in this project names a type
	// from it. That is the strongest form of un-opinionated available - the
	// library cannot shape the consumer's code, because the consumer's code
	// never mentions it.
	runtimeOnly "com.liferay:com.liferay.client.extension.spring.boot:2.0.0"

	testImplementation "org.springframework.boot:spring-boot-starter-test"
}
