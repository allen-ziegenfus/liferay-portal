spring.config.import=\
    classpath:/application-default.properties,\
    optional:configtree:${LIFERAY_ROUTES_CLIENT_EXTENSION}/,\
    optional:configtree:${LIFERAY_ROUTES_DXP}/

# Nothing else. The EnvironmentPostProcessor derives the seven
# spring.security.oauth2.* keys from what Liferay Cloud injected above.
#
# Without the library, this file would carry these by hand:
#
#   spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
#       ${com.liferay.lxc.dxp.server.protocol}://${com.liferay.lxc.dxp.mainDomain}/o/oauth2/jwks
#
# Any of the derived values can be overridden simply by writing it here; the
# derived property source is added last and loses every conflict.
