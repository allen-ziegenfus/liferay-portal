spring.config.import=\
    classpath:/application-default.properties,\
    optional:configtree:${LIFERAY_ROUTES_CLIENT_EXTENSION}/,\
    optional:configtree:${LIFERAY_ROUTES_DXP}/

# New, and the reason the @Import could be deleted. Nothing below is required;
# every line is a default being overridden.

# The sample serves no browser traffic of its own, so it does not need the
# library's CORS policy.
#liferay.client.extension.cors.enabled=false

# Liferay's health probe must not require a token.
liferay.client.extension.oauth2.resource-server.permit-all-patterns=/ready

# This client extension only receives object-action callbacks and echoes the
# caller's token back. It holds no outbound credentials of its own.
#liferay.client.extension.oauth2.client.enabled=false
