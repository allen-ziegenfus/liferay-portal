plugins {
	id "java"
	id "org.springframework.boot" version "3.4.5"
	id "io.spring.dependency-management" version "1.1.7"
}

dependencies {
	// Two coordinates instead of one, and that is the visible cost of Option 3
	// at the consumer level.
	//
	// The payoff is that on the day Boot 5 ships, only the second line's
	// version moves. The first artifact has no Spring in it, so it has nothing
	// to be incompatible with.
	implementation "com.liferay:com.liferay.client.extension.core:1.0.0"
	implementation "com.liferay:com.liferay.client.extension.spring.boot.adapter:1.0.0"

	implementation "com.liferay:org.apache.commons.logging:1.2.LIFERAY-PATCHED-2"
	implementation "org.json:json:20231013"

	implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
	implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
	implementation "org.springframework.boot:spring-boot-starter-web"

	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "org.mockito:mockito-core"
}
