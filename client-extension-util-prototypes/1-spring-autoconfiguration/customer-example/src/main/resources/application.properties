#
# Every opinion the library holds is now visible and reversible from here.
#
# Under the current design this file would be empty, because importing
# ClientExtensionUtilSpringBootComponentScan registered the CORS configurer,
# the resource server, the client registrations and the MVC configuration as
# one indivisible unit with no switches.
#

liferay.client.extension.external-reference-codes=acme-inventory-headless-server,acme-inventory-user-agent

# Liferay Cloud injects these. Listed here for local development only.
com.liferay.lxc.dxp.domains=acme.lxc.liferay.com
com.liferay.lxc.dxp.mainDomain=acme.lxc.liferay.com
com.liferay.lxc.dxp.server.protocol=https

# --- Opting out, one piece at a time ---------------------------------------

# We terminate CORS at our own gateway, so we do not want the library's policy.
liferay.client.extension.cors.enabled=false

# ... or keep it, but allow one more header, without forking the library.
#liferay.client.extension.cors.allowed-headers=Authorization,Content-Type,X-Acme-Tenant

# Health probes must not require a token.
liferay.client.extension.oauth2.resource-server.permit-all-patterns=/actuator/health,/ready

# This client extension only serves inbound requests. It holds no outbound
# credentials, so it does not want client registrations at all. Under the
# current design the library would throw IllegalArgumentException at startup
# for the missing external reference codes property.
#liferay.client.extension.oauth2.client.enabled=false
