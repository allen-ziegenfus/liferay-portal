#
# WHAT THE CUSTOMER WRITES
#
# Nothing. Liferay Cloud injects com.liferay.lxc.dxp.* and the OAuth
# credentials; the EnvironmentPostProcessor derives the rest.
#
# ---------------------------------------------------------------------------
# WHAT THEY WOULD WRITE BY HAND WITHOUT THE LIBRARY
#
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
#     https://acme.lxc.liferay.com/o/oauth2/jwks
# spring.security.oauth2.client.registration.acme-erc.client-id=${acme-erc.oauth2.headless.server.client.id}
# spring.security.oauth2.client.registration.acme-erc.client-secret=${acme-erc.oauth2.headless.server.client.secret}
# spring.security.oauth2.client.registration.acme-erc.authorization-grant-type=client_credentials
# spring.security.oauth2.client.registration.acme-erc.client-authentication-method=client_secret_post
# spring.security.oauth2.client.registration.acme-erc.provider=acme-erc
# spring.security.oauth2.client.provider.acme-erc.token-uri=\
#     https://acme.lxc.liferay.com/o/oauth2/token
#
# Seven lines. That is the honest measure of how much of the current 1,100 line
# library is doing work that Spring Boot already does, and it is worth keeping
# in view when deciding how much of it deserves to be a maintained artifact.
# ---------------------------------------------------------------------------

# Overriding anything derived just works, because the derived property source
# is added last and therefore loses to this file.
#spring.security.oauth2.client.provider.acme-erc.token-uri=https://auth.example.com/oauth2/token
