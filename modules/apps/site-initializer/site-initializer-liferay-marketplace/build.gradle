import com.liferay.gradle.plugins.task.DockerCopyTask

task deployDocker(type: DockerCopyTask)

deployDocker {
	dependsOn jar
	containerId = "dxp-server"
	deployDir = "/opt/liferay/deploy"
	sourceFile = jar.archiveFile
}

processResources {
	doLast {
		copy {
			from new File(projectDir, "src/main/resources/site-initializer/thumbnail.png")
			into new File(projectDir, "classes/META-INF/resources")
		}
	}
}