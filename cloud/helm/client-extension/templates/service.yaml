{{- if include "liferay-client-extension.serviceEnabled" . }}
{{- if not (and (include "liferay-client-extension.workloadEnabled" .) (eq (include "liferay-client-extension.workloadKind" .) "Deployment")) }}
{{- fail "workload.kind must be an enabled deployment when service.enabled is true" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
    labels:
        {{- include "liferay-client-extension.labels" . | nindent 8 }}
    name: {{ include "liferay-client-extension.fullname" . }}
spec:
    ports:
        -   name: http
            port: {{ .Values.service.port }}
            protocol: TCP
            targetPort: http
    selector:
        {{- include "liferay-client-extension.selectorLabels" . | nindent 8 }}
    type: {{ .Values.service.type }}
{{- end }}