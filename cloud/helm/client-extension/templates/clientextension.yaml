{{- $configs := include "liferay-client-extension.configs" . | fromJson }}
{{- if not $configs }}
{{- fail "clientExtension.configs is required" }}
{{- end }}
apiVersion: cx.liferay.com/v1alpha1
kind: ClientExtension
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    labels:
        {{- include "liferay-client-extension.labels" . | nindent 8 }}
    name: {{ include "liferay-client-extension.fullname" . }}
spec:
    configs:
        {{- toYaml $configs | nindent 8 }}
    {{- with .Values.clientExtension.domain }}
    domain: {{ . | quote }}
    {{- end }}
    {{- with .Values.clientExtension.dxpNamespace }}
    dxpNamespace: {{ . | quote }}
    {{- end }}
    serviceId: {{ include "liferay-client-extension.serviceId" . | quote }}
    {{- with .Values.clientExtension.version }}
    version: {{ . | quote }}
    {{- end }}
    virtualInstanceId: {{ .Values.clientExtension.virtualInstanceId | quote }}
    {{- if include "liferay-client-extension.workloadEnabled" . }}
    workloadRef:
        kind: {{ include "liferay-client-extension.workloadKind" . }}
        name: {{ include "liferay-client-extension.workloadName" . }}
    {{- end }}