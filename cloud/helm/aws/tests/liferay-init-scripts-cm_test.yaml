suite: liferay-init-scripts-aws ConfigMap
templates:
    -   liferay-init-scripts-cm.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: liferay-init-scripts-aws
            -   isKind:
                    of: ConfigMap
        it: creates a ConfigMap named liferay-init-scripts-aws
    -   asserts:
            -   isNotEmpty:
                    path: data["overlay-sync.sh"]
        it: includes overlay-sync.sh in data