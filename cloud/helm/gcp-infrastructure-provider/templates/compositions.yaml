{{- $templates := list -}}
{{- range $path, $_ := .Files.Glob "compositions/**" -}}
    {{- $content := $.Files.Get $path | trim -}}
    {{- if $content -}}
        {{- $templates = append $templates $content -}}
    {{- end -}}
{{- end -}}
{{- $templateHash := join "\n" (sortAlpha $templates) | sha256sum -}}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-50"
        liferay.com/template-hash: {{ $templateHash | quote }}
    labels:
        liferay.com/template-hash: {{ printf "h-%s" $templateHash | trunc 63 | quote }}
    name: liferay-gcp-infrastructure-provider.gcp.liferay.com
spec:
    compositeTypeRef:
        apiVersion: gcp.liferay.com/v1alpha1
        kind: LiferayInfrastructure
    mode: Pipeline
    pipeline:
        -   functionRef:
                name: function-environment-configs
            input:
                apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                kind: Input
                spec:
                    environmentConfigs:
                        -   ref:
                                name: environment-config
                            type: Reference
                        -   ref:
                                name: liferay-template-store
                            type: Reference
            step: environment-configs
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- $cv := .Files.Get "compositions/context_variables.k" | replace "import crypto" "" -}}
                    {{- $src := .Files.Get "compositions/init.k" | replace "import .context_variables as cv" "" | regexReplaceAll "(?m)^import .*\n" "" | regexReplaceAll "[a-zA-Z0-9_]+\\.[a-zA-Z0-9_]+ \\{" "{" -}}
                    import crypto
                    {{ $cv | nindent 20 }}
                    {{ $src | nindent 20 }}
            step: init-context
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- $cv := .Files.Get "compositions/context_variables.k" | replace "import crypto" "" -}}
                    {{- $src := .Files.Get "compositions/security.k" | regexReplaceAll "(?m)^import .*\n" "" | regexReplaceAll "[a-zA-Z0-9_]+\\.[a-zA-Z0-9_]+ \\{" "{" -}}
                    import crypto
                    {{ $cv | nindent 20 }}
                    {{ $src | nindent 20 }}
            step: security-layer
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- $cv := .Files.Get "compositions/context_variables.k" | replace "import crypto" "" -}}
                    {{- $srcSql := .Files.Get "compositions/sql.k" | replace "import .context_variables as cv" "" -}}
                    {{- $srcStorage := .Files.Get "compositions/storage.k" | replace "import .context_variables as cv" "" -}}
                    {{- $srcOverlay := .Files.Get "compositions/overlay.k" | replace "import .context_variables as cv" "" -}}
                    import crypto
                    {{ $cv | nindent 20 }}
                    {{ $srcSql | nindent 20 }}
                    {{ $srcStorage | nindent 20 }}
                    {{ $srcOverlay | nindent 20 }}
            step: stateful-layer
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- $cv := .Files.Get "compositions/context_variables.k" | replace "import crypto" "" -}}
                    {{- $srcK8s := .Files.Get "compositions/k8s.k" | replace "import .context_variables as cv" "" -}}
                    {{- $srcEs := .Files.Get "compositions/elasticsearch.k" | replace "import .context_variables as cv" "" -}}
                    {{- $srcBackup := .Files.Get "compositions/backup.k" | replace "import .context_variables as cv" "" -}}
                    {{- $srcMsd := .Files.Get "compositions/managed_service_details.k" | replace "import .context_variables as cv" "" -}}
                    import crypto
                    {{ $cv | nindent 20 }}
                    {{ $srcK8s | nindent 20 }}
                    {{ $srcEs | nindent 20 }}
                    {{ $srcBackup | nindent 20 }}
                    {{ $srcMsd | nindent 20 }}
            step: application-layer
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources