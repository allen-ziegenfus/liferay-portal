{{- $templates := list -}}
{{- range $path, $_ := .Files.Glob "compositions/**" -}}
    {{- $content := $.Files.Get $path | trim -}}
    {{- if $content -}}
        {{- $templates = append $templates $content -}}
    {{- end -}}
{{- end -}}
{{- $templateHash := join "\n" (sortAlpha $templates) | sha256sum -}}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-50"
        liferay.com/template-hash: {{ $templateHash | quote }}
    labels:
        liferay.com/template-hash: {{ printf "h-%s" $templateHash | trunc 63 | quote }}
    name: liferay-gcp-infrastructure-provider.gcp.liferay.com
spec:
    compositeTypeRef:
        apiVersion: gcp.liferay.com/v1alpha1
        kind: LiferayInfrastructure
    mode: Pipeline
    pipeline:
        -   functionRef:
                name: function-environment-configs
            input:
                apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                kind: Input
                spec:
                    environmentConfigs:
                        -   ref:
                                name: environment-config
                            type: Reference
                        -   ref:
                                name: liferay-template-store
                            type: Reference
            step: environment-configs
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- .Files.Get "compositions/init.kcl" | nindent 20 }}
            step: init-context
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- .Files.Get "compositions/security.kcl" | nindent 20 }}
            step: security-layer
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- .Files.Get "compositions/sql.kcl" | nindent 20 }}
                    ---
                    {{- .Files.Get "compositions/storage.kcl" | nindent 20 }}
                    ---
                    {{- .Files.Get "compositions/overlay.kcl" | nindent 20 }}
            step: stateful-layer
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- .Files.Get "compositions/k8s.kcl" | nindent 20 }}
                    ---
                    {{- .Files.Get "compositions/elasticsearch.kcl" | nindent 20 }}
                    ---
                    {{- .Files.Get "compositions/backup.kcl" | nindent 20 }}
                    ---
                    {{- .Files.Get "compositions/application.kcl" | nindent 20 }}
            step: application-layer
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    {{- .Files.Get "compositions/context.kcl" | nindent 20 }}
            step: configmap-and-status-layer
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources