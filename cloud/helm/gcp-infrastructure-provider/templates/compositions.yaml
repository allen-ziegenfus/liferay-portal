{{- $templates := list -}}
{{- range $path, $_ := .Files.Glob "compositions/**" -}}
    {{- $content := $.Files.Get $path | trim -}}
    {{- if $content -}}
        {{- $templates = append $templates $content -}}
    {{- end -}}
{{- end -}}
{{- $templateHash := join "\n" (sortAlpha $templates) | sha256sum -}}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-50"
        liferay.com/template-hash: {{ $templateHash | quote }}
    labels:
        liferay.com/template-hash: {{ printf "h-%s" $templateHash | trunc 63 | quote }}
    name: liferay-gcp-infrastructure-provider.gcp.liferay.com
spec:
    compositeTypeRef:
        apiVersion: gcp.liferay.com/v1alpha1
        kind: LiferayInfrastructure
    mode: Pipeline
    pipeline:
        -   functionRef:
                name: function-environment-configs
            input:
                apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                kind: Input
                spec:
                    environmentConfigs:
                        -   ref:
                                name: environment-config
                            type: Reference
                        -   ref:
                                name: liferay-template-store
                            type: Reference
            step: environment-configs
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: kcl.fn.crossplane.io/v1beta1
                kind: KCLInput
                source: |
                    import crypto
                    import yaml
                    import json
                    import k8s.api.core.v1 as k8s_core
                    import k8s.api.batch.v1 as k8s_batch
                    import k8s.api.rbac.v1 as k8s_rbac
                    {{- include "kcl.load_layer" (dict "root" . "path" "compositions/models.k") | nindent 20 }}
                    {{- include "kcl.load_layer" (dict "root" . "path" "compositions/context_variables.k") | nindent 20 }}
                    
                    _all_items = []
                    
                    {{- $layers := list "init" "security" "sql" "storage" "overlay" "k8s" "elasticsearch" "backup" "managed_service_details" -}}
                    {{- range $layer := $layers }}
                    # --- Layer: {{ $layer }} ---
                    {{- $src := (include "kcl.load_layer" (dict "root" $ "path" (printf "compositions/%s.k" $layer))) -}}
                    {{- $src = $src | replace "models." "" -}}
                    {{- $src = $src | replace "get_items =" (printf "get_items_%s =" $layer) -}}
                    {{- $src = $src | replace "_vars =" (printf "_vars_%s =" $layer) -}}
                    {{- $src = $src | replace "items =" (printf "items_%s =" $layer) -}}
                    {{- $src = $src | replace "get_items(cv.obs, _vars)" (printf "get_items_%s(cv.obs, _vars_%s)" $layer $layer) }}
                    {{ $src | nindent 20 }}
                    _all_items += {{ printf "items_%s" $layer }}.items
                    {{- end }}
                    
                    items = {"items": _all_items}
            step: composite-logic
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources
